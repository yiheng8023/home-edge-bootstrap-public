name: Release candidate

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to verify
        required: true
        default: v0.1.4
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  linux:
    name: Linux local verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/home-edge-verify-local.log"
          sh scripts/verify-local.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()[-30:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=scripts/verify-local.sh,title=Local verification failed::{message}")
          PY
            exit "$status"
          fi

  macos:
    name: macOS local verification
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/home-edge-verify-local.log"
          sh scripts/verify-local.sh 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            python3 - "$log" <<'PY'
          import pathlib, sys
          lines = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace").splitlines()[-30:]
          message = "\n".join(lines).replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          print(f"::error file=scripts/verify-local.sh,title=Local verification failed::{message}")
          PY
            exit "$status"
          fi

  windows:
    name: Windows local verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: powershell
        run: |
          $Log = Join-Path $env:RUNNER_TEMP "home-edge-verify-local.log"
          $ErrorActionPreference = "Continue"
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts\verify-local.ps1 2>&1 |
            Tee-Object -FilePath $Log
          $Status = $LASTEXITCODE
          if ($Status -ne 0) {
            $Message = ((Get-Content -LiteralPath $Log -Tail 30) -join "`n").
              Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Host "::error file=scripts/verify-local.ps1,title=Local verification failed::$Message"
            exit $Status
          }

  release-candidate:
    name: Verified release candidate
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Acquire pinned runtime payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home-edge-payload"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/mihomo.gz" \
            https://github.com/MetaCubeX/mihomo/releases/download/v1.19.28/mihomo-linux-arm64-v1.19.28.gz
          gzip -dc "$RUNNER_TEMP/mihomo.gz" >"$RUNNER_TEMP/home-edge-payload/mihomo-linux-arm64"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/home-edge-payload/ShellCrash.tar.gz" \
            https://github.com/juewuy/ShellCrash/releases/download/1.9.4/ShellCrash.tar.gz
          python3 - "$RUNNER_TEMP/home-edge-payload" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          def digest(name):
              return hashlib.sha256((root / name).read_bytes()).hexdigest()
          manifest = {
              "schema": 1,
              "payloads": [
                  {"id": "mihomo-linux-arm64", "path": "mihomo-linux-arm64", "version": "v1.19.28", "sourceRepository": "MetaCubeX/mihomo", "sha256": digest("mihomo-linux-arm64")},
                  {"id": "shellcrash", "path": "ShellCrash.tar.gz", "version": "1.9.4", "sourceRepository": "juewuy/ShellCrash", "sha256": digest("ShellCrash.tar.gz")},
              ],
          }
          (root / "MANIFEST.json").write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Prepare complete corresponding source
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/go1.26.5.linux-amd64.tar.gz" \
            https://go.dev/dl/go1.26.5.linux-amd64.tar.gz
          sh scripts/prepare-public-sources.sh \
            --output "$RUNNER_TEMP/home-edge-prepared" \
            --payload-dir "$RUNNER_TEMP/home-edge-payload" \
            --go-archive "$RUNNER_TEMP/go1.26.5.linux-amd64.tar.gz"

      - name: Build and verify exact release set
        run: |
          sh scripts/build-public-release.sh \
            --repo . \
            --version "$RELEASE_VERSION" \
            --prepared-dir "$RUNNER_TEMP/home-edge-prepared" \
            --output "$RUNNER_TEMP/home-edge-dist" \
            --commit "$GITHUB_SHA"
          sh scripts/verify-public-release.sh \
            --repo . \
            --version "$RELEASE_VERSION" \
            --dist "$RUNNER_TEMP/home-edge-dist" \
            --commit "$GITHUB_SHA"

      - name: Upload verified candidate
        uses: actions/upload-artifact@v4
        with:
          name: home-edge-bootstrap-${{ env.RELEASE_VERSION }}-${{ github.sha }}
          path: ${{ runner.temp }}/home-edge-dist/
          if-no-files-found: error
          retention-days: 14
